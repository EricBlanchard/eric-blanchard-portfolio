name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  # Labels belong to the issues API.
  issues: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      # Nothing is checked out, so tell the gh CLI which repository to act on.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor updates merge on their own once the required "Verify" check passes.
      # Branch protection on main is what makes this safe: nothing merges red.
      - name: Auto-merge patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Flag major updates for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          # Create the label on first use (or refresh it), so this works before setup-github.sh runs.
          gh label create "needs review" --color FBCA04 --description "Waiting for a human review" --force
          gh pr edit "$PR_URL" --add-label "needs review"
          gh pr comment "$PR_URL" --body "Major version update. CI will still run, but this one waits for a human review before merging."
