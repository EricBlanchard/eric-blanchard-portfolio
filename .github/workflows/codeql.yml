name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 11 * * 3"
  # Run it by hand from the Actions tab.
  workflow_dispatch:

permissions:
  # CodeQL reads its own workflow run to label and upload results.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      # Code scanning alerts need a public repository (or GitHub Code Security on a private
      # one). Without it the scan still runs, and its results are kept as a run artifact.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - if: github.event.repository.private
        uses: actions/upload-artifact@v5
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 30
