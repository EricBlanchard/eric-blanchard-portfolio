name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  # Weekly rebuild, after Monday's Dependabot PRs have merged: re-measures and redeploys.
  # (Merges made by the auto-merge bot use GITHUB_TOKEN, which does not trigger push runs.)
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Public origin for canonical links, the sitemap and social previews.
  # Override with the SITE_URL repository variable if the domain ever changes.
  SITE_URL: ${{ vars.SITE_URL || 'https://ericblanchard.ca' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency signatures and production advisories
        run: |
          npm audit signatures
          npm audit --omit=dev --audit-level=high

      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Unit and component tests (with coverage)
        run: npm run test:ci

      - name: Build Storybook into the site
        run: |
          npm run publish-reports
          npm run build-storybook

      - name: Build
        run: npm run build

      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Lighthouse budgets
        run: npm run lighthouse

      - name: Collect quality report
        if: always()
        run: npm run quality

      - name: Summary
        if: always()
        run: |
          {
            echo "## Quality report"
            echo '```json'
            cat generated/quality.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            reports/
            coverage/
          retention-days: 14

      - name: Upload site inputs for deploy
        uses: actions/upload-artifact@v5
        with:
          name: site-inputs
          path: |
            generated/quality.json
            public/storybook/
            public/reports/
          retention-days: 3

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets are not available to forks or Dependabot; those PRs are verified but not previewed.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Until the Netlify secrets are added, skip deploying (with a note) instead of failing.
      - name: Check Netlify credentials
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Skipping deploy: add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID as repository secrets (Settings > Secrets and variables > Actions)."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v5
        if: steps.netlify.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.netlify.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.netlify.outputs.ready == 'true'

      - uses: actions/download-artifact@v5
        if: steps.netlify.outputs.ready == 'true'
        with:
          name: site-inputs

      - name: Build and deploy to Netlify
        id: deploy
        if: steps.netlify.outputs.ready == 'true'
        env:
          # Contact form settings. Public by design: they end up in the page's JavaScript,
          # and EmailJS restricts their use by allowed origin. They can live either in these
          # GitHub variables or in Netlify's environment variables. Only the deploy build
          # gets them, so the verify job's tests stay deterministic.
          EMAILJS_SERVICE_ID: ${{ vars.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ vars.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ vars.EMAILJS_PUBLIC_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          IS_PROD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          # Pass the GitHub values on only when set, so empty ones never mask Netlify's.
          # (if blocks, not `&&`: Actions runs bash with -e, so a false test would end the step.)
          if [ -n "$EMAILJS_SERVICE_ID" ]; then export NEXT_PUBLIC_EMAILJS_SERVICE_ID="$EMAILJS_SERVICE_ID"; fi
          if [ -n "$EMAILJS_TEMPLATE_ID" ]; then export NEXT_PUBLIC_EMAILJS_TEMPLATE_ID="$EMAILJS_TEMPLATE_ID"; fi
          if [ -n "$EMAILJS_PUBLIC_KEY" ]; then export NEXT_PUBLIC_EMAILJS_PUBLIC_KEY="$EMAILJS_PUBLIC_KEY"; fi
          args=(deploy --build --json --message "${GITHUB_SHA::7} via GitHub Actions")
          if [ "$IS_PROD" = "true" ]; then
            args+=(--prod)
          else
            args+=(--alias "pr-${{ github.event.pull_request.number }}")
          fi
          npx --yes netlify-cli@27 "${args[@]}" > deploy.json
          url=$(node -e "const d=require('./deploy.json'); console.log(d.deploy_url || d.url)")
          if [ "$IS_PROD" = "true" ]; then
            url=$(node -e "const d=require('./deploy.json'); console.log(d.url || d.deploy_url)")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link
        if: github.event_name == 'pull_request' && steps.netlify.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Preview: ${{ steps.deploy.outputs.url }} (commit ${GITHUB_SHA::7})"
