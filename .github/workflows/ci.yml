name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  # Weekly rebuild, after Monday's Dependabot PRs have merged: re-measures and redeploys.
  # (Merges made by the auto-merge bot use GITHUB_TOKEN, which does not trigger push runs.)
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency signatures and production advisories
        run: |
          npm audit signatures
          npm audit --omit=dev --audit-level=high

      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Unit and component tests (with coverage)
        run: npm run test:ci

      - name: Build Storybook into the site
        run: |
          npm run publish-reports
          npm run build-storybook

      - name: Build
        run: npm run build

      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Lighthouse budgets
        run: npm run lighthouse

      - name: Collect quality report
        if: always()
        run: npm run quality

      - name: Summary
        if: always()
        run: |
          {
            echo "## Quality report"
            echo '```json'
            cat generated/quality.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            reports/
            coverage/
          retention-days: 14

      - name: Upload site inputs for deploy
        uses: actions/upload-artifact@v5
        with:
          name: site-inputs
          path: |
            generated/quality.json
            public/storybook/
            public/reports/
          retention-days: 3

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets are not available to forks or Dependabot; those PRs are verified but not previewed.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: site-inputs

      - name: Build and deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          IS_PROD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          args=(deploy --build --json --message "${GITHUB_SHA::7} via GitHub Actions")
          if [ "$IS_PROD" = "true" ]; then
            args+=(--prod)
          else
            args+=(--alias "pr-${{ github.event.pull_request.number }}")
          fi
          npx --yes netlify-cli@27 "${args[@]}" > deploy.json
          url=$(node -e "const d=require('./deploy.json'); console.log(d.deploy_url || d.url)")
          if [ "$IS_PROD" = "true" ]; then
            url=$(node -e "const d=require('./deploy.json'); console.log(d.url || d.deploy_url)")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Preview: ${{ steps.deploy.outputs.url }} (commit ${GITHUB_SHA::7})"
